<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My property — PropCare</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="pc-sidebar"></aside>

  <div class="main">
    <header class="topbar" id="pc-topbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <p class="eyebrow">Your managed portfolio</p>
          <h1 class="page-title">Properties</h1>
          <p class="page-sub" id="pc-prop-sub"></p>
        </div>
        <button class="btn btn-primary"><span aria-hidden="true">+</span> Add property</button>
      </div>

      <section class="stat-grid" id="pc-prop-stats"></section>

      <section class="card section-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Property</th><th>Location</th><th>Units</th><th>Manager</th><th>Open requests</th><th></th>
              </tr>
            </thead>
            <tbody id="pc-prop-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="data/user.js"></script>
<script src="data/notifications.js"></script>
<script src="data/properties.js"></script>
<script src="js/app.js"></script>
<script>
  PC.mountShell("property");

  var data = window.PROPCARE_PROPERTIES;
  var s = data.stats;

  document.getElementById("pc-prop-sub").textContent =
    s.propertiesCount + " properties · " + s.totalUnits + " active units";

  document.getElementById("pc-prop-stats").innerHTML = [
    { label: "Properties", value: s.propertiesCount, foot: s.propertiesRegion, icon: "building" },
    { label: "Occupied units", value: s.occupiedUnits + " / " + s.totalUnits, foot: s.occupancyRate, icon: "home", positive: true },
    { label: "Open issues", value: s.openIssues, foot: s.openIssuesFoot, icon: "wrench" },
    { label: "On service plan", value: s.servicePlanPct + "%", foot: s.servicePlanFoot, icon: "shield", positive: true }
  ].map(function (c) {
    return (
      '<div class="card stat-card">' +
        '<div class="stat-top">' +
          '<span class="stat-label">' + c.label + "</span>" +
          '<div class="stat-icon">' + PC.icon(c.icon) + "</div>" +
        "</div>" +
        '<div class="stat-value">' + c.value + "</div>" +
        '<div class="stat-foot' + (c.positive ? " positive" : "") + '">' + c.foot + "</div>" +
      "</div>"
    );
  }).join("");

  document.getElementById("pc-prop-rows").innerHTML = data.items.map(function (p) {
    return (
      "<tr>" +
        "<td>" +
          '<span class="req-title">' + p.name + "</span>" +
          '<span class="req-meta">' + p.address + "</span>" +
        "</td>" +
        "<td>" + p.location + "</td>" +
        "<td>" + p.units + "</td>" +
        "<td>" + p.manager + "</td>" +
        "<td>" + PC.openBadge(p.open) + "</td>" +
        '<td class="chevron">' + PC.icon("chevron") + "</td>" +
      "</tr>"
    );
  }).join("");
</script>
</body>
</html>
