<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My requests — PropCare</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="pc-sidebar"></aside>

  <div class="main">
    <header class="topbar" id="pc-topbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <p class="eyebrow">Maintenance workflow</p>
          <h1 class="page-title">My requests</h1>
          <p class="page-sub" id="pc-req-sub"></p>
        </div>
        <button class="btn btn-primary">
          <span aria-hidden="true">+</span> Report an issue
        </button>
      </div>

      <section class="card section-card">
        <div class="filters-row">
          <input class="input" type="search" id="pc-search" placeholder="Search requests" />
          <select class="input" id="pc-status-filter" style="min-width:160px;">
            <option value="">All statuses</option>
            <option value="Submitted">Submitted</option>
            <option value="In progress">In progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <span class="filters-count" id="pc-req-count"></span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Request</th><th>Location</th><th>Priority</th><th>Status</th><th>Updated</th>
              </tr>
            </thead>
            <tbody id="pc-req-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="data/user.js"></script>
<script src="data/notifications.js"></script>
<script src="data/requests.js"></script>
<script src="js/app.js"></script>
<script>
  PC.mountShell("requests");

  var all = window.PROPCARE_REQUESTS.items;
  var total = window.PROPCARE_REQUESTS.totalCount;

  function render() {
    var q = document.getElementById("pc-search").value.trim().toLowerCase();
    var status = document.getElementById("pc-status-filter").value;
    var filtered = all.filter(function (r) {
      var matchesQ = !q || r.title.toLowerCase().indexOf(q) > -1 || r.code.toLowerCase().indexOf(q) > -1;
      var matchesStatus = !status || r.status === status;
      return matchesQ && matchesStatus;
    });

    document.getElementById("pc-req-sub").textContent = all.length + " visible requests · sorted by latest activity";
    document.getElementById("pc-req-count").textContent = "Showing " + filtered.length + " of " + total;

    document.getElementById("pc-req-rows").innerHTML = filtered.map(function (r) {
      return (
        "<tr>" +
          "<td>" +
            '<span class="req-code">' + r.code + "</span>" +
            '<span class="req-title">' + r.title + "</span>" +
            '<span class="req-meta">' + r.category + " · " + r.reporter + "</span>" +
          "</td>" +
          "<td>" +
            '<span class="loc-main">' + r.location + "</span>" +
            '<span class="loc-sub">' + r.unit + "</span>" +
          "</td>" +
          "<td>" + PC.priorityBadge(r.priority) + "</td>" +
          "<td>" + PC.statusBadge(r.status) + "</td>" +
          "<td>" + r.updated + "</td>" +
        "</tr>"
      );
    }).join("") || '<tr><td colspan="5"><div class="empty-state">No requests match your filters.</div></td></tr>';
  }

  document.getElementById("pc-search").addEventListener("input", render);
  document.getElementById("pc-status-filter").addEventListener("change", render);
  render();
</script>
</body>
</html>
